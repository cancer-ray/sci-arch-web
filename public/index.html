        <!-- Structured data -->
        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "SoftwareApplication",
          "name": "sci-arch",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "Web",
          "description": "AI-native, Part 11-aligned electronic lab notebook. freeLN is a free, local-first markdown notebook; sci-arch+ adds synced, audit-ready, e-signable records.",
          "url": "https://sci-arch.ca/",
          "offers": [
            { "@type": "Offer", "name": "freeLN", "price": "0", "priceCurrency": "CAD" },
            { "@type": "Offer", "name": "soloLN", "price": "15", "priceCurrency": "CAD" },
            { "@type": "Offer", "name": "groupLN", "price": "49", "priceCurrency": "CAD" }
          ]
        }
        </script>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Spectral:wght@300;400;500;600&display=swap" rel="stylesheet" />
